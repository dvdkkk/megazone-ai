    <text x="2" y="180" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">Transform · Tomorrow · Together</text>
  </g>
</svg>

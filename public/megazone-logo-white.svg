      C 65,106 79,120 85,140 
      C 91,120 105,106 122,99 
      C 105,92 91,78 85,58 Z
    " fill="#FFFFFF"/>
  </g>

  <!-- Wordmark Group: MEGAZONE CLOUD & Tagline -->
  <g transform="translate(230, 0)" fill="#FFFFFF">
    <!-- MEGAZONE -->
    <text x="0" y="68" font-family="'Montserrat', 'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="2.5" fill="#FFFFFF">MEGAZONE</text>
    
    <!-- CLOUD -->
    <text x="0" y="138" font-family="'Montserrat', 'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="6" fill="#FFFFFF">CLOUD</text>
    

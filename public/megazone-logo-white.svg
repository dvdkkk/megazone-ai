    <path fill-rule="evenodd" clip-rule="evenodd" d="
      M 85,0 
      C 89.5,0 93.8,3.2 96.5,8.8 
      C 109.5,35.2 136.2,55.8 167.5,62.2 
      C 173.8,63.5 177.2,70.5 173.8,76.2 
      C 158.2,101.8 133.5,120.2 104.2,129.5 
      C 110.8,141.8 121.2,151.8 133.8,158.5 
      C 139.8,161.8 140.8,169.5 136.2,174.2 
      C 116.5,193.5 90.2,201.2 63.5,196.2 
      C 57.5,195 54.5,188.5 57.2,183 
      C 67.5,162 71.5,138 68,114 
      C 55.5,107.2 45.2,97.2 38.5,84.8 
      C 35.2,78.8 38.5,71.5 44.8,70.2 
      C 72.5,64.2 95.5,45.2 107.2,20 
      C 100.8,12.8 96.5,6.5 92.5,2.5 
